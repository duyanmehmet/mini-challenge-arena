[variables]
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci --ignore-scripts || npm install --ignore-scripts"]

[phases.build]
cmds = ["npm run build 2>/dev/null || echo 'No build step'"]

[start]
cmd = "npx ts-node src/app.ts"
