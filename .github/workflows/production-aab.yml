name: Production AAB

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 19.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit 2>&1 || true

      - name: Build Production AAB
        working-directory: mobile
        run: eas build --platform android --profile production --local --non-interactive

      - name: Locate AAB
        working-directory: mobile
        run: |
          echo "=== Searching for AAB files ==="
          find . -name "*.aab" -not -path "*/node_modules/*" 2>/dev/null
          ls -la *.aab 2>/dev/null || echo "No AAB in mobile/ root"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeka-meydani-production-${{ github.run_number }}
          path: |
            mobile/*.aab
            mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30
